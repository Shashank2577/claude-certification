# Netlify deploy for the Next.js app. Netlify DB (Neon) provides NETLIFY_DATABASE_URL at runtime.
# Migrations are NOT run during the build; run `pnpm db:migrate` against the unpooled URL (see README).

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Pinned explicitly so builds don't depend on auto-detection.
[[plugins]]
  package = "@netlify/plugin-nextjs"
